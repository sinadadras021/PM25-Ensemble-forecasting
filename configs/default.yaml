# =============================================================================
# PM2.5 multi-ensemble forecasting -- reference configuration
# =============================================================================
# Every value below is the one stated in the paper. Section numbers in comments
# refer to the manuscript; docs/PAPER_MAPPING.md maps each equation and table to
# the function that implements it.
#
# The ONLY value you must change is paths.raw_dir:
#
#     pm25forecast run-all --config configs/default.yaml --raw-dir /path/to/csvs
#     PM25_PATHS__RAW_DIR=/path/to/csvs pm25forecast run-all
#
# Validate before spending any compute:
#
#     pm25forecast validate-config --config configs/default.yaml --strict-paths
# =============================================================================

project: pm25-ensemble-forecasting
seed: 42
deterministic: true

paths:
  # One CSV per monitoring station. See docs/DATA_SCHEMA.md for expected columns.
  # Data is NOT distributed with this repository.
  raw_dir: "<SET ME: directory containing one CSV per station>"
  work_dir: "./artifacts"

data:                          # paper 2.1
  station_glob: "*.csv"
  datetime_column: "Date"
  datetime_formats:
    - "%m/%d/%Y %H:%M"
    - "%Y-%m-%d %H:%M:%S"
    - "%Y-%m-%d %H:%M"
  target: "PM 2.5 ug/m3"
  # PM10 is strongly collinear with PM2.5 and would let the model read most of
  # its own answer off a co-measured channel; NOx = NO + NO2 by construction;
  # `feel` is a deterministic function of temperature, humidity and wind.
  drop_columns: ["PM 10 ug/m3", "NOx ppb", "feel"]
  global_start: "2015-01-01 00:00"
  global_end: "2024-12-30 23:00"
  min_target_completeness: 0.0   # the paper states no station-admission rule

outliers:                      # paper 2.2 -- IQR, k = 1.5, values EXCLUDED
  enabled: true
  k: 1.5
  fit_on: train                # bounds from training data only
  columns: []                  # empty = every numeric column
  include_target: true         # training block only; val/test labels are never touched

imputation:                    # paper 2.2 -- KNN, fitted on training data
  n_neighbors: 5
  weights: uniform
  short_gap_hours: 0           # beyond the paper; 0 hands every gap to KNN
  fit_on: train

features:                      # paper 2.2
  wind_components: true        # Eqs. 1-2; a no-op when U/V are already stored
  wind_speed_column: "wind_speed"
  wind_direction_column: "wind_direction"
  cyclical: ["hour"]           # Eqs. 3-4: Hour_sin, Hour_cos
  hour_offset_feature: true    # 0..47, lets meta-learners model lead-time decay
  add_day_of_year: false       # beyond the paper

split:                         # paper 2.2
  development: ["2015-01-01 00:00", "2023-12-30 23:00"]
  test:        ["2024-01-01 00:00", "2024-12-30 23:00"]
  base_train_ratio: 0.70       # 70% training / 30% validation
  gap_hours: 48                # temporal gap preventing train/val window overlap
  meta_train_ratio: 0.80       # 80/20 inside each meta-learner

windows:                       # paper Table 3
  input_hours: 48
  horizon_hours: 48
  stride:
    train: 1
    val: 1
    test: 48                   # non-overlapping test windows
  min_windows:
    train: 500
    val: 100
    test: 20
  min_label_completeness: 0.75
  daily_anchor_hour: 0         # each window = exactly two calendar days
  max_gap_hours: 0

scaling:                       # paper 2.2 -- min-max to [0, 1], training only
  method: minmax
  fit_on: train
  clip_scaled: null

base_models:                   # paper 4.1, Table 2
  names: ["lstm", "gru", "bi_lstm", "bi_gru"]
  rnn_units: [64, 32]          # LSTM / GRU
  bi_units: [32, 32]           # Bi-LSTM / Bi-GRU
  dropout: 0.20
  learning_rate: 0.001
  epochs: 100
  batch_size: 32
  early_stopping_patience: 10
  iwl_alpha: 10.0              # Eq. 19 -- loss for LSTM / GRU
  eel_power: 2.0               # Eq. 20 -- loss for Bi-LSTM / Bi-GRU

ensembles:                     # paper 4.2, Table 2
  names: ["sa", "pwe", "mlp_meta", "xgb_meta", "h_mos", "sms"]
  mlp_hidden: [32, 16, 8]      # MLP-Meta
  mlp_dropout: 0.10
  mlp_learning_rate: 0.001
  mlp_epochs: 100
  mlp_batch_size: 256
  xgb_n_estimators: 100        # XGB-Meta: 100 trees, depth 6, lr 0.1
  xgb_max_depth: 6
  xgb_learning_rate: 0.1
  sms_n_estimators: 100        # SMS random-forest selector
  sms_max_depth: 6
  pwe_method: SLSQP            # PWE convex weights

evaluation:                    # paper 4.4, Eqs. 14-18
  min_hours_per_day: 18
  peak_threshold_ugm3: 35.0    # beyond the paper; null disables event scoring
  prediction_clip: [0.0, 500.0]
  baselines: []                # beyond the paper; see configs/extended.yaml
  bootstrap_samples: 0
  run_ablation: true           # paper 5.5
