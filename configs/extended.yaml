# =============================================================================
# BEYOND THE PAPER -- optional robustness settings
# =============================================================================
# Everything here departs from the published method. None of it is on by default,
# and results produced with this file must NOT be reported as reproducing the
# paper. Its purpose is to answer the questions a careful reader will have after
# reading docs/METHODS.md (Assumptions and limitations).
#
# Run it beside configs/default.yaml and compare 04_results/.
# =============================================================================

project: pm25-extended

paths:
  raw_dir: "<SET ME: directory containing one CSV per station>"
  work_dir: "./artifacts_extended"

outliers:
  # Leave the target untouched even in training. Strictly conservative: the model
  # then learns from the same episode magnitudes it will be scored on.
  include_target: false

imputation:
  # Fill gaps of up to 3 hours by interpolation before handing the rest to KNN.
  short_gap_hours: 3

features:
  # Seasonality beyond the diurnal cycle.
  add_day_of_year: true

scaling:
  # Guard against a single unprecedented test value saturating a recurrent layer.
  clip_scaled: [-5.0, 5.0]

evaluation:
  # Naive references. If six ensembles cannot beat anomaly persistence, that is
  # the single most important thing to know.
  baselines: ["persistence", "climatology", "persistence_anomaly"]
  bootstrap_samples: 1000
