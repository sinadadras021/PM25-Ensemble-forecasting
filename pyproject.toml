[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25forecast"
version = "2.0.0"
description = "Pooled deep ensembles for 48-hour urban PM2.5 forecasting"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.24,<2", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<1.6", "joblib>=1.3", "tensorflow>=2.10,<2.16", "xgboost>=1.7,<4", "matplotlib>=3.7,<4", "shap>=0.46,<0.50"]

[project.scripts]
pm25forecast = "pm25forecast.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/sinadadras021/PM25-Ensemble-forecasting"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]
