name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU TensorFlow -- GitHub runners have no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu
          pip install -e ".[dev]"

      # Style is advisory: a formatting nit should not mask a real test failure.
      - name: Lint
        continue-on-error: true
        run: ruff check src tests

      - name: Format check
        continue-on-error: true
        run: black --check src tests

      # These are not advisory. test_paper_fidelity pins the implementation to the
      # published method, so a failure here means the code and the paper have
      # drifted apart.
      - name: Paper-fidelity and unit tests
        run: pytest -q -m "not slow"

      - name: End-to-end smoke run
        if: matrix.python-version == '3.11'
        run: pytest -q -m slow
